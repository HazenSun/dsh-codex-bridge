# DSH Codex Bridge runs as a headless, stdout-clean MCP host over dsh-base.

- id: hmr
  disabled: true

- id: system-prompt
  config:
    personaPrefix: >-
      You are an implementation agent powered by {{model}}. Your working directory is {{cwd}}.
      Work only inside that workspace and finish with concise, verifiable evidence.
    personaSuffix: ''

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

# The bridge is non-interactive and always works in a disposable task worktree.
- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: bridge-worktree
    presets:
      bridge-worktree:
        sandbox: workspace-write
        approval: never
        name: Bridge worktree
        description: Write only inside the isolated task worktree without interactive prompts.

- id: session-telemetry-otel
  disabled: true

# One-shot tools; Bridge accepts only foreground child completion evidence.
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    maxDepth: 2

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    maxDepth: 2

- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        name: Bridge implementation
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: Implement only the bounded Bridge task and return verifiable evidence.
              suffix: Your working directory is {{cwd}}.

    - id: dsh-codex-bridge
      name: '@dsh-codex-bridge/dsh-plugin'
